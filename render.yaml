services:
  - type: web
    name: mvp-academico
    runtime: node
    plan: free
    region: virginia
    autoDeployTrigger: off
    buildCommand: npm ci --include=dev && npm run typecheck && npm run build
    startCommand: npm run start:production
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: mvp-academico-db
          property: connectionString

databases:
  - name: mvp-academico-db
    plan: free
    region: virginia
    postgresMajorVersion: "17"
    databaseName: academic_catalog
    user: academic
    ipAllowList: []
