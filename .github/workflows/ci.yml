name: Catalog CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: academic
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: academic_catalog_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U academic -d academic_catalog_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://academic:ci_only_password@localhost:5432/academic_catalog_test
      TEST_DATABASE_URL: postgresql://academic:ci_only_password@localhost:5432/academic_catalog_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run db:migrate
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run db:seed
      - run: npm run test:postgres
      - name: Verify memory adapter too
        run: env -u TEST_DATABASE_URL npm test
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Verify frontend
        run: npm run test:browser
