services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: academic
      POSTGRES_PASSWORD: academic_local_only
      POSTGRES_DB: academic_catalog
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - academic_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U academic -d academic_catalog"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  academic_pg:
